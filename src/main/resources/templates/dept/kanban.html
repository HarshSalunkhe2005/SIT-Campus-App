<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue board · SIT Campus App</title>
    <meta name="theme-color" content="#c52f33">
    <link rel="icon" href="../../static/images/Symlogo333.jpg">
    <link rel="stylesheet" href="../../static/css/app.css">
</head>
<body data-role="dept" data-active="board">
<main id="main" class="page">
    <div class="page-head">
        <div>
            <h1 id="boardTitle">Issue board</h1>
            <p id="boardSub">Issues assigned to your department. Drag a card to the next column, or use the buttons on the card.</p>
        </div>
        <div class="head-actions">
            <div class="view-toggle" role="group" aria-label="View">
                <button type="button" id="viewBoard" aria-pressed="true"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>Board</button>
                <button type="button" id="viewList" aria-pressed="false"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</button>
            </div>
            <button type="button" class="btn btn-secondary" id="refreshBtn"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Refresh</button>
        </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div id="boardView">
        <div class="board" id="board">
            <section class="col" data-status="PENDING" aria-labelledby="h-PENDING">
                <div class="col-head"><h2 id="h-PENDING"><span class="kpi-dot" style="background:var(--st-new-fg)"></span>New</h2><span class="col-count" id="count-PENDING">0</span></div>
                <div class="col-body" id="body-PENDING"></div>
            </section>
            <section class="col" data-status="IN_PROGRESS" aria-labelledby="h-IN_PROGRESS">
                <div class="col-head"><h2 id="h-IN_PROGRESS"><span class="kpi-dot" style="background:#b7791f"></span>In progress</h2><span class="col-count" id="count-IN_PROGRESS">0</span></div>
                <div class="col-body" id="body-IN_PROGRESS"></div>
            </section>
            <section class="col" data-status="RESOLVED" aria-labelledby="h-RESOLVED">
                <div class="col-head"><h2 id="h-RESOLVED"><span class="kpi-dot" style="background:var(--st-resolved-fg)"></span>Resolved</h2><span class="col-count" id="count-RESOLVED">0</span></div>
                <div class="col-body" id="body-RESOLVED"></div>
            </section>
        </div>
    </div>

    <div id="listView" hidden>
        <div class="toolbar">
            <div class="input-icon grow">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input class="input" id="listSearch" type="search" placeholder="Search by place or description" aria-label="Search issues">
            </div>
            <select class="select" id="listStatus" aria-label="Filter by status">
                <option value="OPEN">Open issues</option>
                <option value="PENDING">New</option>
                <option value="IN_PROGRESS">In progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="ALL">All</option>
            </select>
        </div>
        <div class="card"><div class="table-wrap">
            <table class="table">
                <thead><tr><th>Issue</th><th>Priority</th><th>Reported</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
                <tbody id="listBody"></tbody>
            </table>
        </div></div>
    </div>
</main>

<script src="../../static/js/shared/toast.js"></script>
<script src="../../static/js/shared/api.js"></script>
<script src="../../static/js/shared/ui.js"></script>
<script src="../../static/js/dept/board.js"></script>
</body>
</html>
