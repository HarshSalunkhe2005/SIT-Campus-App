<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT Campus App - My Issues</title>
    <link rel="stylesheet" href="../../static/css/shared/base.css" th:href="@{/css/shared/base.css}">
    <link rel="stylesheet" href="../../static/css/student/dashboard.css" th:href="@{/css/student/dashboard.css}">
</head>
<body>

    <!-- App Header -->
    <header class="sit-app-header">
        <div class="sit-app-header__brand">
            <img src="../../static/images/Symlogo333.jpg" th:src="@{/images/Symlogo333.jpg}" alt="SIT Pune Logo" class="sit-app-header__logo">
            <span class="sit-app-header__name">SIT Campus App</span>
        </div>
        <div class="sit-app-header__user">
            <span class="sit-app-header__welcome">Welcome, <strong th:text="${studentName}">Student</strong></span>
            <form th:action="@{/logout}" action="/logout" method="post">
                <button type="submit" class="sit-app-header__logout">Logout</button>
            </form>
        </div>
    </header>

    <main class="sit-dashboard">

        <!-- Page Top Bar -->
        <div class="sit-dashboard__top-bar">
            <h1 class="sit-dashboard__title">My Reported Issues</h1>
            <a th:href="@{/student/report}" href="/student/report" class="sit-btn-primary">
                <span>+</span> Report New Issue
            </a>
        </div>

        <!-- Issue List -->
        <section class="sit-issue-list" th:if="${issues != null and not #lists.isEmpty(issues)}">
            <div class="sit-issue-card" th:each="issue : ${issues}">
                <div class="sit-issue-card__header">
                    <h3 class="sit-issue-card__title" th:text="${issue.title}">Issue Title</h3>
                    <span class="sit-badge"
                          th:text="${issue.status == 'OPEN' ? 'Open' : (issue.status == 'IN_PROGRESS' ? 'In Progress' : 'Resolved')}"
                          th:classappend="${issue.status == 'OPEN' ? ' sit-badge--open' : (issue.status == 'IN_PROGRESS' ? ' sit-badge--in-progress' : ' sit-badge--resolved')}">
                        Open
                    </span>
                </div>
                <p class="sit-issue-card__description" th:text="${issue.description}">Issue description goes here.</p>
                <div class="sit-issue-card__meta">
                    <span class="sit-issue-card__dept">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sit-meta-icon">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span th:text="${issue.department}">Department</span>
                    </span>
                    <span class="sit-issue-card__date">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sit-meta-icon">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span th:text="${#temporals.format(issue.createdAt, 'dd MMM yyyy')}">01 Jan 2025</span>
                    </span>
                </div>
            </div>
        </section>

        <!-- Empty State -->
        <div class="sit-empty-state" th:if="${issues == null or #lists.isEmpty(issues)}">
            <svg class="sit-empty-state__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <h2 class="sit-empty-state__heading">No issues reported yet</h2>
            <p class="sit-empty-state__text">Spot something broken on campus? Let us know and we'll get it fixed.</p>
            <a th:href="@{/student/report}" href="/student/report" class="sit-btn-primary">Report Your First Issue</a>
        </div>

    </main>

</body>
</html>
