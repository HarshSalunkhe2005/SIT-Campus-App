<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments · SIT Campus App</title>
    <meta name="theme-color" content="#c52f33">
    <link rel="icon" href="../../static/images/Symlogo333.jpg">
    <link rel="stylesheet" href="../../static/css/app.css">
</head>
<body data-role="admin" data-active="departments">
<main id="main" class="page">
    <div class="page-head">
        <div>
            <h1>Departments</h1>
            <p>Each department receives the issues for its category and logs in with the email below.</p>
        </div>
        <div class="head-actions">
            <button type="button" class="btn btn-primary" id="addBtn"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add department</button>
        </div>
    </div>
    <div class="card"><div class="table-wrap">
        <table class="table">
            <thead><tr><th>Department</th><th>Category</th><th>Login email</th><th><span class="sr-only">Actions</span></th></tr></thead>
            <tbody id="deptBody"></tbody>
        </table>
    </div></div>
</main>

<script src="../../static/js/shared/toast.js"></script>
<script src="../../static/js/shared/api.js"></script>
<script src="../../static/js/shared/ui.js"></script>
<script src="../../static/js/admin/departments.js"></script>
</body>
</html>
