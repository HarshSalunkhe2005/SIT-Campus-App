<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview · SIT Campus App</title>
    <meta name="theme-color" content="#c52f33">
    <link rel="icon" href="../../static/images/Symlogo333.jpg">
    <link rel="stylesheet" href="../../static/css/app.css">
</head>
<body data-role="admin" data-active="overview">
<main id="main" class="page">
    <div class="page-head">
        <div>
            <h1>Overview</h1>
            <p>All reports across campus and how each department is doing.</p>
        </div>
        <div class="head-actions">
            <button type="button" class="btn btn-secondary" id="refreshBtn"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Refresh</button>
        </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="grid-eq" style="margin-bottom:24px">
        <section class="card" aria-labelledby="h-breakdown">
            <div class="card-head"><h2 id="h-breakdown">Status breakdown</h2></div>
            <div class="card-pad" id="breakdown"></div>
        </section>
        <section class="card" aria-labelledby="h-depts">
            <div class="card-head"><h2 id="h-depts">Department performance</h2><a class="btn btn-ghost btn-sm" href="departments.html">Manage</a></div>
            <div class="table-wrap">
                <table class="table">
                    <thead><tr><th>Department</th><th class="num">Open</th><th>Resolved</th></tr></thead>
                    <tbody id="deptBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <section aria-labelledby="h-issues">
        <div class="page-head" style="margin-bottom:12px"><h2 id="h-issues" style="font-size:22px">All issues</h2></div>
        <div class="toolbar">
            <div class="input-icon grow">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input class="input" id="search" type="search" placeholder="Search by place, description or student" aria-label="Search issues">
            </div>
            <select class="select" id="statusFilter" aria-label="Filter by status">
                <option value="ALL">All statuses</option>
                <option value="NEW">New</option>
                <option value="IN_PROGRESS">In progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
            </select>
            <select class="select" id="deptFilter" aria-label="Filter by department"><option value="ALL">All departments</option></select>
        </div>
        <div class="card"><div class="table-wrap">
            <table class="table">
                <thead><tr><th>Issue</th><th>Department</th><th>Reported by</th><th>Reported</th><th>Status</th><th class="num">Upvotes</th></tr></thead>
                <tbody id="issueBody"></tbody>
            </table>
        </div></div>
    </section>
</main>

<script src="../../static/js/shared/toast.js"></script>
<script src="../../static/js/shared/api.js"></script>
<script src="../../static/js/shared/ui.js"></script>
<script src="../../static/js/admin/hub.js"></script>
</body>
</html>
