<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students · SIT Campus App</title>
    <meta name="theme-color" content="#c52f33">
    <link rel="icon" href="../../static/images/Symlogo333.jpg">
    <link rel="stylesheet" href="../../static/css/app.css">
</head>
<body data-role="admin" data-active="users">
<main id="main" class="page">
    <div class="page-head">
        <div>
            <h1>Students</h1>
            <p>Everyone who has registered. Disabling an account stops that student from logging in straight away.</p>
        </div>
    </div>
    <div class="toolbar">
        <div class="input-icon grow">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input class="input" id="search" type="search" placeholder="Search by name, PRN or email" aria-label="Search students">
        </div>
        <select class="select" id="statusFilter" aria-label="Filter by account status">
            <option value="ALL">All accounts</option>
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
        </select>
    </div>
    <div class="card"><div class="table-wrap">
        <table class="table">
            <thead><tr><th>Student</th><th>PRN</th><th>Batch</th><th>Account</th><th><span class="sr-only">Actions</span></th></tr></thead>
            <tbody id="userBody"></tbody>
        </table>
    </div></div>
</main>

<script src="../../static/js/shared/toast.js"></script>
<script src="../../static/js/shared/api.js"></script>
<script src="../../static/js/shared/ui.js"></script>
<script src="../../static/js/admin/users.js"></script>
</body>
</html>
