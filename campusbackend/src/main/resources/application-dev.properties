# Local development profile: no external services needed.
#   ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev"
# In-memory H2 database, emails are printed to the console instead of sent, and a throwaway admin and
# departments are created on every start. DEVELOPMENT ONLY: never use these values anywhere real.
spring.datasource.url=jdbc:h2:mem:campus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=dev-only-secret-dev-only-secret-0123456789abcdef

app.mail.log-only=true

app.bootstrap.admin-email=admin@sitpune.edu.in
app.bootstrap.admin-password=Admin@12345
app.bootstrap.dept-password=Dept@12345
