# Secrets and environment-specific values are NOT stored here. Provide them as environment variables or in a
# git-ignored `.env` file (repo root or campusbackend/). See `.env.example`.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:8080}
server.error.include-message=never

# Uploads (complaint and proof photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Mail (OTP and resolution emails)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# Browser origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Optional first-run bootstrap: creates the admin (and the default departments) if missing.
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.dept-password=${BOOTSTRAP_DEPT_PASSWORD:}
